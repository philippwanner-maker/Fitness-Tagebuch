<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101615">
  <title>SET — Dein Training. Dein Rhythmus.</title>
  <style>
    :root{color-scheme:dark;--bg:#101615;--text:#f1f5ef;--muted:#a8b6af;--accent:#d2f980;--line:rgba(255,255,255,.08);--error:#ffaf9e;--radius:26px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;min-height:100vh}button,input,select{font:inherit;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.05);color:inherit;min-height:44px;padding:10px 14px;cursor:pointer}button:hover{background:rgba(255,255,255,.1)}input,select{display:block;width:100%;background:rgba(7,13,12,.5);font-size:16px;margin-top:8px}label{display:block;font-size:12px;font-weight:600;margin:12px 0}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(36px,6vw,58px);line-height:1.06;letter-spacing:-2.5px;font-weight:650;margin-bottom:26px}h1 span{color:var(--accent)}h2{font-size:23px;line-height:1.2;margin-bottom:12px}.muted,.micro{color:var(--muted);font-size:13px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:650;color:var(--accent);margin-bottom:12px}.ambient{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 85% 5%,#5b6f3c65,transparent 45%),radial-gradient(ellipse at 5% 45%,#29595455,transparent 50%);pointer-events:none}.topbar{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:26px 28px}.brand{text-decoration:none;font-size:34px;font-weight:850;letter-spacing:-2px}.brand span{color:var(--accent)}main{max-width:920px;margin:0 auto;padding:30px 26px 150px}.panel,.exercise,.science-card{background:rgba(27,30,30,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);padding:26px;margin-bottom:20px}.row,.two-col{display:flex;align-items:center;justify-content:space-between;gap:14px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{width:100%;margin:8px 0}.primary{background:var(--accent);color:#18230c;border-color:transparent;font-weight:700}.secondary{background:rgba(255,255,255,.04)}.start-card{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;background:linear-gradient(120deg,#cbe9a31c,#1b1e1e99)}.start-card strong{display:block;font-size:21px;margin:8px 0}.round-arrow{display:grid;place-items:center;width:48px;height:48px;border:1px solid #d2f98040;border-radius:50%;color:var(--accent);font-size:25px}.science-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.science-card{margin:0;padding:25px}.exercise h3{font-size:20px}.set{display:flex;gap:10px;margin-top:10px}.body-map{max-width:620px;margin:4px auto 0;text-align:center}.body-stage{display:flex;justify-content:center;gap:20px;margin-bottom:15px}.body-view{display:none}.body-view.is-visible{display:block}svg{width:140px;height:auto;overflow:visible}.scan-shell{fill:rgba(255,255,255,.02);stroke:rgba(255,255,255,.15);stroke-width:1.2px}.scan-cloud{fill:rgba(255,255,255,0.1)}.body-tabs{display:flex;gap:4px;padding:4px;margin:12px auto 0;max-width:320px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.18)}body-tabs button{flex:1;border:0;font-size:12px;min-height:40px}button[aria-selected=true]{color:var(--accent);background:rgba(210,249,128,.12)}
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <header class="topbar">
    <a href="#home" class="brand">SET<span>●</span></a>
    <span class="muted">Training lokal · Profil online</span>
  </header>
  <main>
    <section id="home">
      <p class="eyebrow" id="todayLabel"></p>
      <article class="panel" style="padding:34px">
        <span class="eyebrow">EIN GEDANKE FÜR HEUTE</span>
        <blockquote id="quote" style="font-size:24px; margin:15px 0"></blockquote>
        <span id="quoteAuthor" class="muted"></span>
      </article>
      <button class="panel start-card" data-tab="training">
        <span><span class="eyebrow">ZEIT FÜR DICH</span><strong>Dein Training beginnt hier.</strong><span class="muted">Ein Satz nach dem anderen.</span></span>
        <span class="round-arrow">↗</span>
      </button>
      <h2>Wissen, das dich weiterbringt</h2>
      <div id="scienceGrid" class="science-grid"></div>
    </section>

    <section id="training" hidden>
      <h1>Neues Training<span>.</span></h1>
      <form id="workoutForm">
        <div class="panel">
          <div class="two-col">
            <label>Trainingsdatum<input type="date" id="date" required></label>
            <label>Trainingstag<select id="workoutDay"><option value="">Freies Training</option></select></label>
          </div>
        </div>
        <div id="exercises"></div>
        <button type="submit" class="primary full">Training beenden & speichern →</button>
      </form>
    </section>

    <section id="profile" hidden>
      <h1>Dein Profil<span>.</span></h1>
      <div class="panel">
        <p class="eyebrow">DEIN PERSÖNLICHER RAUM</p>
        <input id="profileNameInput" placeholder="Dein Name...">
        <span id="profilePersonalCode" class="micro"></span>
      </div>
      <div id="muscleMapRoot" class="panel"></div>
      <button id="exportData" class="secondary full">Daten exportieren</button>
    </section>
  </main>

  <script>
    'use strict';
    const KEY = 'set-fitness-v1';
    const uid = () => crypto.randomUUID();
    const copy = x => JSON.parse(JSON.stringify(x));
    const localDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const fmt = d => new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});

    const SetMuscleMap = (() => {
      const bodyPath='M220 17 C206 17 200 26 201 39 C201 49 206 56 208 62 C211 75 198 80 184 84 C169 86 160 94 157 110 C153 126 151 145 148 160 C145 177 140 195 137 212 Z';
      function counts(workouts) {
        const res={chest:0,quads:0,latissimus:0};
        workouts.forEach(w=>w.exercises.forEach(e=>{
          if(/brust|bank/.test(e.name.toLowerCase())) res.chest+=e.sets.length;
          if(/knie|bein/.test(e.name.toLowerCase())) res.quads+=e.sets.length;
          if(/ruder|lat/.test(e.name.toLowerCase())) res.latissimus+=e.sets.length;
        }));
        return res;
      }
      return {
        render: (root, workouts) => {
          root.innerHTML=`<div class="body-map"><div class="body-stage">
            <div id="v-front" class="body-view is-visible"><svg viewBox="112 6 216 438"><path class="scan-shell" d="${bodyPath}"/><g id="m-chest" class="scan-cloud"><circle cx="201" cy="121" r="15"/><circle cx="239" cy="121" r="15"/></g><g id="m-quads" class="scan-cloud"><circle cx="199" cy="281" r="18"/><circle cx="241" cy="281" r="18"/></g></svg></div>
            <div id="v-back" class="body-view"><svg viewBox="112 6 216 438"><path class="scan-shell" d="${bodyPath}"/><g id="m-lat" class="scan-cloud"><circle cx="200" cy="158" r="15"/><circle cx="240" cy="158" r="15"/></g></svg></div>
          </div><div class="body-tabs"><button type="button" id="b-front" aria-selected="true">Vorderseite</button><button type="button" id="b-back" aria-selected="false">Rückseite</button></div></div>`;
          
          const mc=counts(workouts);
          if(mc.chest>0) root.querySelectorAll('#m-chest circle').forEach(c=>c.style.fill='var(--accent)');
          if(mc.quads>0) root.querySelectorAll('#m-quads circle').forEach(c=>c.style.fill='var(--accent)');
          if(mc.latissimus>0) root.querySelectorAll('#m-lat circle').forEach(c=>c.style.fill='var(--accent)');

          const bf=$('#b-front'), bb=$('#b-back'), vf=$('#v-front'), vb=$('#v-back');
          if(bf&&bb&&vf&&vb){
            bf.onclick=()=>{bf.setAttribute('aria-selected','true');bb.setAttribute('aria-selected','false');vf.classList.add('is-visible');vb.classList.remove('is-visible')};
            bb.onclick=()=>{bb.setAttribute('aria-selected','true');bf.setAttribute('aria-selected','false');vb.classList.add('is-visible');vf.classList.remove('is-visible')};
          }
        }
      };
    })();

    function boot(){
      const $=s=>document.querySelector(s);
      let db={workouts:[],community:{profileCode:makeProfileCode()}}, current=blank();
      try{const raw=localStorage.getItem(KEY); if(raw)db=JSON.parse(raw)}catch(e){}

      function renderEditor() {
        $('#date').value=current.date;
        $('#exercises').innerHTML=`<div class="exercise panel"><h3>Bankdrücken</h3><div class="set"><input type="number" placeholder="kg" id="w1"> <input type="number" placeholder="Wdh" id="r1"></div></div>`;
      }
      function renderHome(){
        $('#todayLabel').textContent=fmt(localDate());
        $('#quote').textContent="“No human is limited.”";
        $('#quoteAuthor').textContent="Eliud Kipchoge";
        $('#scienceGrid').innerHTML=`<article class="science-card"><h3>Bewegung wirkt</h3><p class="muted">Krafttraining senkt nachweislich den Blutdruck.</p></article><article class="science-card"><h3>Ernährung</h3><p class="muted">Protein unterstützt die Regeneration.</p></article>`;
      }
      function renderProfile(){
        $('#profilePersonalCode').textContent=db.community.profileCode;
        SetMuscleMap.render($('#muscleMapRoot'),db.workouts);
      }
      function show(tab){
        document.querySelectorAll('main>section').forEach(el=>el.hidden=el.id!==tab);
        if(tab==='profile')renderProfile(); if(tab==='home')renderHome(); if(tab==='training')renderEditor();
      }
      document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
      $('#workoutForm').onsubmit=ev=>{
